<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>学习计划</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <div class="widget">
      <header class="titlebar">
        <div class="drag" data-tauri-drag-region>
          <button class="nav-btn" id="btn-prev-day" title="前一天">‹</button>
          <span class="date" id="date-label"></span>
          <button class="nav-btn" id="btn-next-day" title="后一天">›</button>
          <span class="weekday" id="weekday-label"></span>
          <button class="link-btn today-btn" id="btn-today" hidden>回今天</button>
        </div>
        <div class="controls">
          <button class="ctrl-btn" id="btn-collapse" title="收起 / 展开">▾</button>
          <button class="ctrl-btn danger" id="btn-close" title="关闭">✕</button>
        </div>
      </header>

      <section class="collapsed-tasks" id="collapsed-tasks"></section>

      <section class="summary">
        <div class="summary-top">
          <span id="progress-text">今日 0/0</span>
          <span class="streak" id="streak"></span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </section>

      <section class="tasks" id="tasks">
        <ul class="task-list" id="task-list"></ul>
        <div class="empty" id="empty-hint">今天还没有计划，添加一个吧</div>
      </section>

      <section class="history">
        <div class="history-head">
          <span class="history-title">近 7 天</span>
          <button class="link-btn" id="btn-all-plans">全部计划</button>
        </div>
        <div class="history-bars" id="history-bars"></div>
      </section>

      <footer class="addbar">
        <div class="addbar-row">
          <input type="text" id="input-title" placeholder="添加学习任务…" autocomplete="off" />
          <button id="btn-add" title="添加">＋</button>
        </div>
        <div class="addbar-row">
          <input type="date" id="input-date" title="计划日期" />
          <input type="time" id="input-start" title="开始时间" />
          <input type="time" id="input-end" title="结束时间" />
        </div>
      </footer>

      <div class="overlay" id="all-plans" hidden>
        <div class="overlay-head">
          <span class="overlay-title">全部计划</span>
          <button class="ctrl-btn" id="btn-all-close" title="关闭">✕</button>
        </div>
        <div class="overlay-body" id="all-plans-body"></div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
  </body>
</html>
